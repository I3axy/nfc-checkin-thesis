<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InnoHub — Control Center</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <meta name="theme-color" content="#060c18" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        font-family: 'Outfit', sans-serif;
        background: #060c18;
        color: #e2e8f0;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #0d1524; }
      ::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }

      @keyframes pulse-ring {
        0%   { transform: scale(1);   opacity: 1; }
        100% { transform: scale(2.5); opacity: 0; }
      }
      @keyframes glow-in {
        from { box-shadow: 0 0 0px #10b98100; }
        to   { box-shadow: 0 0 18px #10b98144; }
      }
      @keyframes slide-up {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      .live-dot {
        position: relative;
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #10b981;
      }
      .live-dot::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #10b981;
        animation: pulse-ring 1.8s ease-out infinite;
      }
      .card-in  { animation: glow-in 0.4s ease forwards; }
      .slide-up { animation: slide-up 0.3s ease forwards; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
