<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <title>Dolgozói alkalmazás</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      /* ==== Design tokens — keep in sync with apps/dashboard and apps/scanner.
             The worker app follows the phone's dark/light preference. ==== */
      :root {
        color-scheme: dark;
        --bg: #0b0b0d;
        --surface: #131316;
        --surface-2: #1a1a1f;
        --border: #26262c;
        --text: #ececef;
        --muted: #8f8f99;
        --accent: #818cf8;
        --accent-contrast: #0b0b0d;
        --green: #34d399;
        --red: #f87171;
        --warn: #fbbf24;
        --cal-justified: #a78bfa;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f7f7f8;
          --surface: #ffffff;
          --surface-2: #f2f2f4;
          --border: #e4e4e9;
          --text: #1a1a1f;
          --muted: #6e6e78;
          --accent: #4f46e5;
          --accent-contrast: #ffffff;
          --green: #059669;
          --red: #dc2626;
          --warn: #b45309;
          --cal-justified: #7c3aed;
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      input, select, button { font-family: inherit; }

      /* Az olvasásra váró képernyő kártyajele köré futó hullám. Egyetlen
         mozgó elem az alkalmazásban — jelzi, hogy a rendszer aktívan vár. */
      @keyframes nfc-pulse {
        0%   { transform: scale(0.94); opacity: 0.35; }
        70%  { transform: scale(1.14); opacity: 0; }
        100% { transform: scale(1.14); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:2rem;gap:0.75rem;text-align:center">'
          + '<div style="width:56px;height:2px;background:var(--red)"></div>'
          + '<div style="font-weight:700;font-size:1.15rem">Az alkalmazás hibába ütközött</div>'
          + '<div style="font-size:0.85rem;color:var(--muted);max-width:340px;line-height:1.5">Töltsd újra az oldalt. Ha a hiba megmarad, jelezd a vezetődnek.</div>'
          + '<div style="font-size:0.72rem;color:var(--muted);opacity:0.7;word-break:break-all;font-family:monospace;margin-top:0.5rem">' + (e.message || 'ismeretlen hiba') + '</div>'
          + '</div>'
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
