<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <title>Worker App</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body { background: #1d4ed8; font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1e3a8a;color:#fff;font-family:monospace;padding:2rem;gap:1rem;text-align:center">'
          + '<div style="font-size:2.5rem">💥</div>'
          + '<div style="font-weight:bold;font-size:1.1rem">JS Error</div>'
          + '<div style="font-size:0.8rem;color:#bfdbfe;word-break:break-all">' + (e.message || 'Unknown error') + '</div>'
          + '</div>'
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
